name: Development build

on:
  pull_request:
    types: [opened, reopened]
    branches: ['Amethyst-iOS-J25Exp', 'main']
  push:
    branches: ['Amethyst-iOS-J25Exp', 'main']
  workflow_dispatch:

jobs:
  build:
    name: Development build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install make wget ldid
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: lumencraft-jres-v1

      - name: Resolve env (paths, SDK)
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "RUNNER=0" >> $GITHUB_ENV

      - name: Verify tools
        run: |
          gmake --version | head -1
          ldid -V 2>&1 | head -1 || true
          cmake --version | head -1
          wget --version | head -1
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDKPATH=$SDKPATH"

      - name: Build sideload IPA & TrollStore tIPA
        shell: bash
        run: |
          set -eo pipefail

          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          export SLIMMED=1

          export CFLAGS="-Wno-error=implicit-function-declaration $CFLAGS"
          export CXXFLAGS="-Wno-error=implicit-function-declaration $CXXFLAGS"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5

          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          mkdir -p logs

          run_make() {
            gmake -j"$(sysctl -n hw.ncpu)" "$@" 2>&1 \
              | sed -u '/vtool warning: code signature will be invalid/d'
          }

          run_make dsym package PLATFORM=2 $SIGN_FLAGS 2>&1 | tee logs/build-sideload.log
          run_make dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2>&1 | tee logs/build-trollstore.log

      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload TrollStore tIPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.catsruledogs.lumencraft-ios-trollstore
          path: artifacts/org.catsruledogs.lumencraft-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload TrollStore tIPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.catsruledogs.lumencraft-ios-trollstore-slimmed
          path: artifacts/org.catsruledogs.lumencraft.slimmed-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.catsruledogs.lumencraft-ios
          path: artifacts/org.catsruledogs.lumencraft-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.catsruledogs.lumencraft-ios-slimmed
          path: artifacts/org.catsruledogs.lumencraft.slimmed-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload LumenCraft.dSYM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LumenCraft.dSYM
          path: artifacts/LumenCraft.dSYM
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            logs/*.log
            Natives/build/CMakeFiles/CMakeConfigureLog.yaml
            Natives/build/mobileglues/CMakeFiles/CMakeConfigureLog.yaml
            Natives/build/CMakeFiles/CMakeError.log
            Natives/build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
