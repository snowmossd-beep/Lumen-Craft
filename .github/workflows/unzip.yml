name: Unpack parts

on:
  push:
    paths:
      - 'LumenCraft-part-*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-parts
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip parts
        run: |
          shopt -s nullglob
          parts=(LumenCraft-part-*.zip)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No parts found"
            exit 0
          fi
          for z in "${parts[@]}"; do
            unzip -oq "$z"
            rm -f "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source parts" || exit 0
          git push
          
